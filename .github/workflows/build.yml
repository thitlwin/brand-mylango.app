name: Build

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    name: Build brand package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build
